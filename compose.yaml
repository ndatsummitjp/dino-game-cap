services:
  app:
    build:
      context: .
    ports:
      - "4004:4004"
    environment:
      PORT: 4004
      CDS_SERVER_INDEX: "true"
      CDS_REQUIRES_AUTH_KIND: mocked
      CDS_REQUIRES_DB_KIND: postgres
      CDS_REQUIRES_DB_CREDENTIALS_HOST: postgres
      CDS_REQUIRES_DB_CREDENTIALS_PORT: 5432
      CDS_REQUIRES_DB_CREDENTIALS_USER: ${POSTGRES_USER:-dino}
      CDS_REQUIRES_DB_CREDENTIALS_PASSWORD: ${POSTGRES_PASSWORD:-dino}
      CDS_REQUIRES_DB_CREDENTIALS_DATABASE: ${POSTGRES_DB:-dino}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dino}
      POSTGRES_DB: ${POSTGRES_DB:-dino}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
